version: 2

# Dependabot VERSION updates. Security updates are a separate, repo-level
# setting (`automated-security-fixes`) and are already on — this file does not
# control them and cannot turn them off.
#
# Added 2026-08-09 when Renovate was removed org-wide.
#
# github-actions is the only ecosystem, and the reason matters: this repo builds
# SQLite from vendored upstream source, pinned in `upstream.lock`. That is not a
# package-manager manifest, so NO dependency bot can read it — not Dependabot,
# not Renovate. Keeping the SQLite version current is a manual process against
# upstream's release notes, and adding this file does not change that.
#
# `deny.toml` (cargo-deny) is likewise a policy file, not a manifest.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["deps"]
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

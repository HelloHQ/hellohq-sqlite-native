# ClusterFuzzLite — PR fuzzing. Builds the fuzz targets from the PR and fuzzes
# only what the PR touches (mode: code-change) for a short budget. This is what
# closes the OSSF Scorecard "Fuzzing" check, and it is a real regression guard:
# it would catch a reintroduced unchecked read in unpack_columns in seconds.
name: cflite-pr
on:
  pull_request:
    paths: ['**']
permissions: read-all
jobs:
  fuzz:
    runs-on: ubuntu-latest
    concurrency:
      group: cflite-pr-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with: { egress-policy: audit }
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true

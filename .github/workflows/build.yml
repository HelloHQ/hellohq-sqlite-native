# build.yml — 5-platform native build matrix for the HelloHQ encrypted + CRDT
# SQLite layer (SQLCipher + cr-sqlite). Each leg: fetch+verify pinned upstream →
# build → run the capability contract (test/contract.c) → upload the artifact.
# A combine job lipos the two macOS arches into a universal binary, and a final
# job attaches SHA-256 checksums + an SBOM + SLSA build provenance.
#
# Validated locally: the macOS legs (build-macos.sh + lipo-macos.sh + contract,
# 9/9 green). The Linux/Windows/Android/iOS legs are first-draft recipes that
# will need iteration on their real runners — they are gated by the same contract
# test, so a broken build fails loudly rather than shipping.
#
# Supply chain: every `uses:` is pinned to a full commit SHA (the `# vN` comment
# records the human-readable version); OSSF Scorecard enforces this.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # so release.yml can reuse this matrix

permissions:
  contents: read

jobs:
  # ── macOS arm64 (Apple Silicon only — Intel/x86_64 dropped, no universal) ────
  # cr-sqlite's -Zbuild-std can't cross-compile, so x86_64 would need the Intel
  # macos-13 runner (the last one, deprecation-bound). HelloHQ targets Apple
  # Silicon, so we ship a single arm64 slice.
  macos:
    runs-on: macos-14
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fetch + verify pinned upstream
        run: bash build/fetch.sh
      - name: Setup Rust (cr-sqlite pinned nightly + rust-src)
        run: bash build/setup-rust.sh
      - name: Build (CommonCrypto) + contract test
        run: bash build/build-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64
          path: dist/macos-arm64/*.dylib

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make tcl libssl-dev patchelf
      - name: Fetch + verify pinned upstream
        run: bash build/fetch.sh
      - name: Setup Rust
        run: bash build/setup-rust.sh
      - name: Build + contract test
        run: bash build/build-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-x64
          path: dist/linux-x64/*.so

  # ── Windows x86_64 — split build (cr-sqlite can't build natively on Windows) ─
  # SQLCipher: MSVC on windows-latest. cr-sqlite: mingw cross from Linux (its own
  # recipe). The `windows` job combines them + runs the contract test.
  windows-sqlcipher:
    runs-on: windows-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (x64 MSVC dev env)
      - name: Install OpenSSL (vcpkg)
        run: vcpkg install openssl:x64-windows
      - name: Fetch + verify pinned upstream
        shell: bash
        run: bash build/fetch.sh
      - name: Build SQLCipher (MSVC)
        shell: pwsh
        env:
          OPENSSL_ROOT: C:/vcpkg/installed/x64-windows
        run: pwsh build/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-sqlcipher
          path: dist/windows-x64/*

  windows-crsqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Fetch + verify pinned upstream
        run: bash build/fetch.sh
      - name: Setup Rust (+ windows-gnu target)
        run: bash build/setup-rust.sh x86_64-pc-windows-gnu
      - name: Build cr-sqlite (mingw cross)
        run: bash build/build-windows-crsqlite.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-crsqlite
          path: dist/windows-x64/*.dll   # crsqlite.dll + bundled mingw runtime

  # SQLite3 Multiple Ciphers — a second, independent sqlite3 library shipped
  # alongside libsqlcipher.dll (NOT a variant of it). The Flutter app's
  # package:sqlite3 hook is configured `source: sqlite3mc` and hellohq_db keys
  # connections with the sqlite3mc-only `PRAGMA cipher = 'sqlcipher'`, which real
  # SQLCipher rejects. Publishing it here lets the app provision it through the
  # same SHA-256 + SLSA trust gate as the other native libs instead of
  # downloading it from a third-party GH release at test start
  # (HelloHQ/hellohq#1074). Self-contained: no OpenSSL, no Rust.
  windows-sqlite3mc:
    runs-on: windows-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (x64 MSVC dev env)
      - name: Fetch + verify pinned upstream
        shell: bash
        env:
          SQLITE3MC: '1'
        run: bash build/fetch.sh
      - name: Build sqlite3mc (MSVC + CMake)
        shell: pwsh
        run: pwsh build/build-windows-sqlite3mc.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-sqlite3mc
          path: dist/windows-x64/sqlite3mc*

  windows:
    needs: [windows-sqlcipher, windows-crsqlite, windows-sqlite3mc]
    runs-on: windows-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: win-sqlcipher, path: dist/windows-x64 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: win-crsqlite, path: dist/windows-x64 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: win-sqlite3mc, path: dist/windows-x64 }
      - name: Contract test
        shell: pwsh
        run: |
          # Absolute paths: PowerShell's & won't run a relative forward-slash path.
          # sqlite3.h ships in the win-sqlcipher artifact (it's generated, not in
          # the raw source), so include from $out.
          $out = Join-Path $PWD 'dist\windows-x64'
          cl /O2 /I "$out" test\contract.c /Fe:"$out\contract.exe" `
             /link /LIBPATH:"$out" sqlcipher.lib
          if ($LASTEXITCODE -ne 0) { throw "cl failed ($LASTEXITCODE)" }
          $env:PATH = "$out;$env:PATH"   # sqlcipher.dll + libcrypto*.dll + mingw runtime
          $db = Join-Path $env:TEMP 'hq-win-contract.db'
          Remove-Item $db -ErrorAction SilentlyContinue
          & "$out\contract.exe" "$out\crsqlite.dll" $db
          if ($LASTEXITCODE -ne 0) { throw "contract failed ($LASTEXITCODE)" }

      - name: Contract test (sqlite3mc)
        shell: pwsh
        run: |
          # Same checklist, second library. sqlite3mc's headers live in their own
          # subdir so its sqlite3.h doesn't shadow SQLCipher's — put that dir
          # FIRST on the include path, and link its own import lib. A distinct
          # exe + db file keeps the two runs from sharing state.
          $out = Join-Path $PWD 'dist\windows-x64'
          $inc = Join-Path $out 'sqlite3mc-include'
          cl /O2 /I "$inc" test\contract.c /Fe:"$out\contract-mc.exe" `
             /link /LIBPATH:"$out" sqlite3mc.lib
          if ($LASTEXITCODE -ne 0) { throw "cl failed ($LASTEXITCODE)" }
          $env:PATH = "$out;$env:PATH"
          $db = Join-Path $env:TEMP 'hq-win-contract-mc.db'
          Remove-Item $db -ErrorAction SilentlyContinue
          & "$out\contract-mc.exe" --sqlite3mc "$out\crsqlite.dll" $db
          if ($LASTEXITCODE -ne 0) { throw "sqlite3mc contract failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/windows-x64/*.dll
            dist/windows-x64/sqlite3mc-include/*.h

  # ── iOS (device arm64 + simulator) → xcframework ────────────────────────────
  ios:
    runs-on: macos-14
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fetch + verify pinned upstream
        run: bash build/fetch.sh
      - name: Setup Rust (+ apple-ios targets)
        run: bash build/setup-rust.sh aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build xcframeworks
        run: bash build/build-ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios
          path: dist/ios

  # ── Android (arm64-v8a, armeabi-v7a, x86_64) ────────────────────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with: { ndk-version: r26d }
      - name: Build OpenSSL per ABI (static, from pinned source)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          OPENSSL_ANDROID: ${{ runner.temp }}/openssl-android
        run: bash build/openssl-android.sh
      - name: Fetch + verify pinned upstream
        run: bash build/fetch.sh
      - name: Setup Rust (+ android targets)
        run: bash build/setup-rust.sh aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install cargo-ndk
        # cr-sqlite's Makefile Android path invokes `cargo ndk` (sets the NDK
        # linker per target). Built with stable (repo root has no toolchain pin).
        run: cargo install cargo-ndk --locked
      - name: Build per-ABI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          OPENSSL_ANDROID: ${{ runner.temp }}/openssl-android
        run: bash build/build-android.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: dist/android

  # ── Android mobile contract: run contract.c on an x86_64 emulator ───────────
  # Verifies the BUILT .so artifact is capability-correct on the real OS (cipher,
  # crsql load, CRR round-trip), not just that it linked. Parallel signal — not a
  # provenance gate yet (emulator flakiness); tighten once it's reliably green.
  android-contract:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: android, path: dist/android }
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with: { ndk-version: r26d }
      - name: Enable KVM (emulator acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Contract on Android emulator
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        with:
          api-level: 24
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash build/run-contract-android.sh

  # ── Provenance: checksums + SBOM + SLSA attestation over all artifacts ──────
  provenance:
    needs: [macos, linux, windows, ios, android]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # SLSA provenance signing
      attestations: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { path: artifacts }
      - name: Flatten + checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.dylib' -o -name '*.so' -o -name '*.dll' \) \
            -exec cp {} release/ \; 2>/dev/null || true
          # xcframeworks are directories — archive them whole.
          for fw in artifacts/ios/*.xcframework; do
            [ -d "$fw" ] && (cd "$(dirname "$fw")" && zip -qr "$OLDPWD/release/$(basename "$fw").zip" "$(basename "$fw")")
          done
          cd release && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release
          output-file: release/sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1
        with:
          subject-path: release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release

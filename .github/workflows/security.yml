# security.yml — supply-chain scanning for the native build repo.
# The public repo is an UNTRUSTED PRODUCER; these gates plus the contract test
# (build.yml) and the consumer-side SHA-256 + SLSA verification (hellohq_db) make
# a compromised fork unable to reach production silently.
#
# Every `uses:` is pinned to a full commit SHA (the `# vN` comment records the
# human-readable version); OSSF Scorecard enforces this.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday — retroactive CVE re-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust dependency hygiene for cr-sqlite (RUSTSEC + license/source allowlist) ─
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Fetch pinned upstream (for Cargo.lock)
        run: bash build/fetch.sh
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .src/cr-sqlite/core/rs/bundle

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: bash build/fetch.sh
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          manifest-path: .src/cr-sqlite/core/rs/bundle/Cargo.toml
          # advisories = RUSTSEC; bans/licenses/sources = supply-chain allowlist.
          command: check advisories bans licenses sources
          # cargo-deny is deny-by-default for licenses; our policy (allow-list +
          # cr-sqlite first-party license clarifications) lives in the repo-root
          # deny.toml, not next to the fetched manifest. The action runs with the
          # workspace as CWD, so reference it relatively.
          command-arguments: --config deny.toml

  # ── Known-CVE deps across all manifests ─────────────────────────────────────
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - env:
          # sqlite3mc ships in the Windows release, so it belongs in the CVE
          # sweep even though only the Windows job compiles it.
          SQLITE3MC: '1'
        run: bash build/fetch.sh
      # The runnable action lives in the osv-scanner-action SUBDIR; the repo-root
      # action.yml has no `runs:` section, which is why the bare
      # `google/osv-scanner-action@…` pin failed with "Top level 'runs:' …".
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # osv-scanner v2 removed the top-level `--skip-git` flag (it errored
          # with "flag provided but not defined"). `scan source` no longer walks
          # git history, so recursive directory scan is all we need.
          scan-args: |-
            --recursive
            ./.src

  # ── Repo sweep: CVEs, secrets, workflow misconfig ───────────────────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── SAST over the C + Rust we BUILD (autobuild traces our build scripts) ─────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, rust]
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang make tcl libssl-dev patchelf
      - run: bash build/fetch.sh
      - run: bash build/setup-rust.sh
      - uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          languages: ${{ matrix.language }}
      - name: Build (so CodeQL can trace the compilers)
        run: bash build/build-linux.sh
      - uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3

  # ── Repo security posture (branch protection, pinned actions, etc.) ─────────
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with: { results_file: results.sarif, results_format: sarif }
      - uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with: { sarif_file: results.sarif }

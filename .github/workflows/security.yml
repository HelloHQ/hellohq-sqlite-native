# security.yml — supply-chain scanning for the native build repo.
# The public repo is an UNTRUSTED PRODUCER; these gates plus the contract test
# (build.yml) and the consumer-side SHA-256 + SLSA verification (hellohq_db) make
# a compromised fork unable to reach production silently.
#
# Every `uses:` is pinned to a full commit SHA (the `# vN` comment records the
# human-readable version); OSSF Scorecard enforces this.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday — retroactive CVE re-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust dependency hygiene for cr-sqlite (RUSTSEC + license/source allowlist) ─
  #
  # `bundle_static` FIRST because it is the crate that ships: cr-sqlite's
  # core/Makefile defaults to `bundle=bundle_static`, and every platform build
  # here runs `make loadable`, which compiles `rs/$(bundle)`. These jobs used to
  # scan only `rs/bundle` — a crate the Makefile never selects — so they reported
  # clean while the shipped extension carried bytes 1.5.0 and shlex 1.2.0.
  cargo-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [bundle_static, bundle]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned upstream (for Cargo.lock)
        run: bash build/fetch.sh
      # KNOWN WARNING (upstream's to fix, not ours): this action still declares
      # `using: node20`, so runs log the Node-20 deprecation notice. v2.0.0 is
      # the newest RELEASE and it is what this SHA pins; the fix (node24) exists
      # only on the action's default branch, unreleased. We will not pin an
      # untagged commit of a security-scanning action to silence a log line —
      # the release boundary is the review boundary. GitHub already force-runs it
      # on Node 24, so nothing is broken. Bump when rustsec tags a node24 release.
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .src/cr-sqlite/core/rs/${{ matrix.crate }}

  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same reasoning as cargo-audit: bundle_static is the crate that ships.
        crate: [bundle_static, bundle]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash build/fetch.sh
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: .src/cr-sqlite/core/rs/${{ matrix.crate }}/Cargo.toml
          # advisories = RUSTSEC; bans/licenses/sources = supply-chain allowlist.
          command: check advisories bans licenses sources
          # cargo-deny is deny-by-default for licenses; our policy (allow-list +
          # cr-sqlite first-party license clarifications) lives in the repo-root
          # deny.toml, not next to the fetched manifest. The action runs with the
          # workspace as CWD, so reference it relatively.
          command-arguments: --config deny.toml

  # ── Known-CVE deps in the dependency graph that actually SHIPS ──────────────
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No SQLITE3MC=1 here (unlike the Windows build). osv-scanner is a
      # MANIFEST scanner and sqlite3mc vendors C amalgamation sources with no
      # lockfile, so the recursive sweep extracted ZERO packages from it — its
      # only effect was an extraction error trying to parse
      # sqlite3mc/LICENSE.spdx as an SPDX SBOM. Skipping that (large) clone
      # costs no CVE coverage: sqlite3mc's C is covered by codeql, and its
      # version is pinned + SHA-verified in upstream.lock.
      - run: bash build/fetch.sh
      # The runnable action lives in the osv-scanner-action SUBDIR; the repo-root
      # action.yml has no `runs:` section, which is why the bare
      # `google/osv-scanner-action@…` pin failed with "Top level 'runs:' …".
      - uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          # SCOPE = the lockfiles that GOVERN THE SHIPPED ARTIFACT, i.e. exactly
          # the crates cargo-audit/cargo-deny target above, for the same reason.
          # cr-sqlite's core/Makefile defaults to `bundle=bundle_static` and every
          # platform script runs `make loadable`, so bundle_static is what
          # compiles. Cargo resolves the WHOLE graph — including the path-deps
          # core/, fractindex-core/ and sqlite-rs-embedded/* — through the lock
          # sitting next to the crate being built, so bundle_static/Cargo.lock is
          # already a COMPLETE picture of what ships. Narrowing to it loses no
          # coverage of the artifact.
          #
          # Why NOT `--recursive ./.src`: that also swept locks which never
          # govern any build — cr-sqlite's Python test suite
          # (py/correctness/requirements.txt → pytest), its JS test tooling
          # (core/pnpm-lock.yaml → minimatch, brace-expansion), its test harness
          # (integration_check/), its build tools (tools/), and the standalone dev
          # locks of sub-crates. Those are UPSTREAM'S TEST DEPENDENCIES: absent
          # from the extension we publish and unfixable from this repo, since
          # .src/ is re-fetched from a pinned commit every build. Keeping them in
          # scope meant 19 unactionable findings that would either block every PR
          # or train reviewers to ignore a red security job. Neither is security.
          #
          # `--no-ignore` IS LOAD-BEARING, not cosmetic. osv-scanner honours
          # .gitignore by default, and `/.src/` is gitignored (it is fetched,
          # never committed) — without this flag the scan skips every file as
          # "ignored" and exits clean having read nothing, which is how this job
          # passed VACUOUSLY before. Do not remove it.
          #
          # `--lockfile` is the STABLE flag; `--experimental-exclude` would let us
          # keep the recursive walk but its name can change without notice, and
          # this workflow has already been bitten by v2 dropping `--skip-git`.
          # Explicit paths also fail LOUDLY (osv-scanner errors on a missing
          # lockfile) if upstream moves these crates, rather than going quietly
          # blind again.
          scan-args: |-
            --no-ignore
            --lockfile=./.src/cr-sqlite/core/rs/bundle_static/Cargo.lock
            --lockfile=./.src/cr-sqlite/core/rs/bundle/Cargo.lock

  # ── Repo sweep: CVEs, secrets, workflow misconfig ───────────────────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── SAST over the C + Rust we BUILD (autobuild traces our build scripts) ─────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # c-cpp ONLY. There is no first-party Rust in this repo — every .rs file
        # lives in the fetched upstream under .src/ (cr-sqlite), which the CodeQL
        # config excludes. Keeping `rust` here made the job fail outright with
        # "CodeQL could not process any code written in Rust / no source code
        # seen during build" (exit 32), because after the exclusion it had zero
        # files to analyze.
        #
        # Upstream's Rust is not unscanned — cargo-audit, cargo-deny AND
        # osv-scanner all run against .src/cr-sqlite/core/rs/{bundle_static,bundle}
        # above (RUSTSEC, bans, licenses, sources, OSV), which is the graph that
        # ships. Add `rust` back the moment this repo gains Rust of its own.
        language: [c-cpp]
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang make tcl libssl-dev patchelf
      - run: bash build/fetch.sh
      - run: bash build/setup-rust.sh
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          # We drive the compilers ourselves in the next step, so declare that.
          # Left unset, the run warned: "Cannot build an overlay database because
          # build-mode is set to 'undefined' instead of 'none'. Falling back to
          # creating a normal full database instead." Stating `manual` makes the
          # contract explicit — CodeQL traces our build-linux.sh rather than
          # guessing — and fails loudly if that build ever stops compiling
          # anything, instead of silently analysing an empty database.
          build-mode: manual
          # Scope CodeQL to code this repo owns. autobuild compiles the FETCHED
          # upstream in .src/, so without this every SQLCipher/SQLite/cr-sqlite
          # finding lands here as ours and cannot be fixed (the tree is
          # re-fetched from a pinned commit each build). Upstream CVEs stay
          # covered by osv-scanner/trivy/cargo-audit above. Rationale in full:
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build (so CodeQL can trace the compilers)
        run: bash build/build-linux.sh
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

  # ── Repo security posture (branch protection, pinned actions, etc.) ─────────
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with: { results_file: results.sarif, results_format: sarif }
      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with: { sarif_file: results.sarif }

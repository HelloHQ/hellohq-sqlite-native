# security.yml — supply-chain scanning for the native build repo.
# The public repo is an UNTRUSTED PRODUCER; these gates plus the contract test
# (build.yml) and the consumer-side SHA-256 + SLSA verification (hellohq_db) make
# a compromised fork unable to reach production silently.
#
# ⚠️ Pin every `uses:` to a full commit SHA before production (Scorecard flags
#    this). Tags are used here during bring-up for readability.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'   # weekly, Monday — retroactive CVE re-scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust dependency hygiene for cr-sqlite (RUSTSEC + license/source allowlist) ─
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - name: Fetch pinned upstream (for Cargo.lock)
        run: bash build/fetch.sh
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: .src/cr-sqlite/core/rs/bundle

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - run: bash build/fetch.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: .src/cr-sqlite/core/rs/bundle/Cargo.toml
          # advisories = RUSTSEC; bans/licenses/sources = supply-chain allowlist.
          command: check advisories bans licenses sources

  # ── Known-CVE deps across all manifests ─────────────────────────────────────
  osv-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - run: bash build/fetch.sh
      - uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./.src

  # ── Repo sweep: CVEs, secrets, workflow misconfig ───────────────────────────
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  # ── SAST over the C + Rust we BUILD (autobuild traces our build scripts) ─────
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, rust]
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y clang make tcl libssl-dev patchelf
      - run: bash build/fetch.sh
      - run: bash build/setup-rust.sh
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build (so CodeQL can trace the compilers)
        run: bash build/build-linux.sh
      - uses: github/codeql-action/analyze@v3

  # ── Repo security posture (branch protection, pinned actions, etc.) ─────────
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@v2
        with: { egress-policy: audit }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@v2
        with: { results_file: results.sarif, results_format: sarif }
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: results.sarif }

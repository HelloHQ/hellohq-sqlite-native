# upstream.lock — pinned upstream sources for the combined SQLCipher + cr-sqlite
# native library. The CI build FETCHES these at build time, verifies them, then
# compiles. No upstream source is vendored into this repo — only these pins, the
# build scripts, and any *.patch files live here.
#
# Bumping an upstream = edit a value below. The build + security-scan + contract
# gate runs on the PR. Crypto/DB bumps require human approval (never auto-merge).
#
# sha256/signature are verified in CI before the source is used.

sqlcipher:
  source: https://github.com/sqlcipher/sqlcipher
  tag:    v4.16.0
  # SQLCipher is distributed via git (no stable signed tarball). Verification =
  # the resolved commit of the tag must equal this immutable SHA.
  commit: e2a6040f2ae5cfff2b3e08eb3320007d93cdf3fc

crsqlite:
  source: https://github.com/superfly/cr-sqlite
  # The superfly fork publishes no release tags — pin the exact commit.
  ref:    HEAD
  commit: 3133cacac0177ff11a2022a5ebd08f17749559f5

# SQLite3 Multiple Ciphers — a SEPARATE library from SQLCipher above, not a
# variant of it. It implements a SQLCipher-*compatible* cipher (`PRAGMA cipher =
# 'sqlcipher'`) alongside its own, with its own built-in crypto (no OpenSSL).
#
# Why we build it: the Flutter app's `package:sqlite3` build hook is configured
# `source: sqlite3mc`, and hellohq_db's unlockSqlcipher() issues the
# sqlite3mc-only `PRAGMA cipher = 'sqlcipher'` + `PRAGMA legacy = 4` before
# `PRAGMA key`. Real SQLCipher does NOT understand those pragmas, so the two are
# not interchangeable at the consumer — see HelloHQ/hellohq#1074.
#
# IMPORTANT - VERSION LOCKSTEP: this must stay equal to the sqlite3mc amalgamation
# vendored in the HelloHQ sqlite3.dart fork (third_party/sqlite3mc/, currently
# "SQLite3 Multiple Ciphers 2.3.4" on SQLite 3.53.1), which is what Linux
# compiles from. Windows loading a different sqlite3mc version would key and
# format databases with different parameters than Linux/macOS. Bump both or
# neither.
sqlite3mc:
  source: https://github.com/utelle/SQLite3MultipleCiphers
  tag:    v2.3.4
  # Annotated tag → this is the COMMIT it dereferences to (fetch.sh pins by SHA).
  commit: 04a7a56392d77fc46007f0023d3eb4b5b701474b

# OpenSSL — SQLCipher's crypto provider on Android (built static, per ABI) and
# linked on Linux/Windows. Apple uses CommonCrypto and pulls NO OpenSSL.
openssl:
  source: https://github.com/openssl/openssl
  tag:    openssl-3.5.7
  commit: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e

# Crypto provider for SQLCipher (per platform):
#   Apple (iOS/macOS) → CommonCrypto (system; no bundled lib, no extra license)
#   Android/Linux/Windows → OpenSSL 3.x (Apache-2.0; bundle its license)
crypto_provider:
  apple:   commoncrypto
  other:   openssl-3
